name: context

on:
  pull_request:
  push:
    branches:
      - loop/es-v4

permissions:
  contents: read

jobs:
  secret-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Secret guard on all tracked files
        run: python3 scripts/secret_guard.py --tracked
      - name: Secret guard on every commit of the pull request
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/secret_guard.py --range "$BASE_SHA..$HEAD_SHA"
