# loop/CONFIG.yaml: flat key: value lines (ralph.sh reads the budget keys with a simple parser).
# Copy this file to <spanish-repo>/loop/CONFIG.yaml and fill the <...> values.

# ---- pinned source ----
english_repo: https://github.com/dullroar/learn-programming-the-weird-way
english_commit: 48a4429c0a22b2aac628b256a50c07d1816bcb80        # never a moving branch
english_tag: 
english_clone_path: /home/lehmer/english-source
plan_path: SYNTHESIZED-TRANSLATION-PLAN-es-bicho-raro.md

# ---- edition identity (provisional defaults; see plan section 16) ----
spanish_title: "¡Aprende a programar como un bicho raro!"
spanish_slug: aprende-a-programar-como-un-bicho-raro
language_tag: es-419
register: tu
acronym_word: BICHO                      # phase macros expand from locale/es.yaml
edition_label: v4-es.0-rc1

# ---- budgets (ralph.sh reads these; environment variables override) ----
max_iterations: 450
max_usd: 150
iteration_timeout_minutes: 45
max_stalled_iterations: 3
sleep_seconds_between_iterations: 5

# ---- model roles (record EXACT model IDs when the run starts) ----
translator: anthropic/claude-sonnet-5-5 (alias: sonnet)
in_loop_reviewer: anthropic/claude-sonnet-5-5 (alias: sonnet)       # a different model tier or vendor than the translator
cross_vendor_review: false                # true only if API keys exist for a second vendor
local_model_for_t3_drafts: false          # true only after it passes the seeded-fault recall bar

# ---- task sizing ----
translate_task_max_source_words: 4000
audit_every_n_translate_tasks: 8
audit_sample_size: 5

# ---- quality bars ----
seeded_fault_recall_bar: 0.95
sentence_word_limit_N: 29                 # calibrated on the pilot (P3-006): 25 x 1.160 (9422 English, 10927 Spanish words); see translation/pilot-calibration.md

# ---- models per agent and tier (revision 5; read by ralph.sh at start-up) ----
# The driver previews the next task and picks a tier: "light" only if the task has "tier": "light"
# (set it with a queue amendment {"amend": ID, "set": {"tier": "light"}}) or its kind is listed
# below, and only on its first attempt; a retried task always gets the standard model. Empty value =
# the CLI's own default. Check what actually ran with: python3 tools/model_report.py
# Claude: sonnet / haiku are aliases. Copilot ids as the CLI logs them (claude-sonnet-5.5, claude-haiku-5.5; verify with
#   a smoke run when the monthly quota is back). Codex: see `codex debug models` (gpt-6.1-terra, gpt-6-luna, gpt-6.2-sol, ...).
tier_light_kinds: packet
claude_model_standard: sonnet
claude_model_light: haiku
copilot_model_standard: claude-sonnet-5.5
copilot_model_light: claude-haiku-5.5
copilot_effort_standard:
copilot_effort_light:
codex_model_standard: gpt-6.1-terra
codex_model_light: gpt-6-luna
codex_effort_standard: medium
codex_effort_light: low
