# lessons/book/locale/es.yaml: Spanish locale catalog (data only; no logic).
# P1-004 writes the acronym and phase catalog. Later tasks (P2-001 onward) add the rest.
#
# The acronym is a PARAMETER. Prose and PO files use the macros {{acronym.word}},
# {{phase.N.letter}} and {{phase.N.name}}, expanded from this file at apply time.
# To switch to the runner-up TORCE, edit only this block and re-apply (see decisions-provisional.md).
# Mermaid node IDs W E I R D never change; only displayed labels do.
# Phase names are written with a capital first letter whose initial is the phase letter.

acronym:
  word: BICHO
  # Exactly the text counted by the editorial test (one occurrence per publication).
  expansion: "Bicho raro, Interpreta, Camino indirecto, Hallazgos y Octetos"
  # First letter of the word is also the first letter of phase 1: the acronym is recursive.
  recursive_letter: "{{phase.1.letter}}"
  recursive_note: "La {{phase.1.letter}} es recursiva."
  # One-sentence gloss used where the English reads "X stands for Y. The W is recursive."
  gloss: "**{{acronym.word}}** significa **Bicho raro, Interpreta, Camino indirecto, Hallazgos y Octetos**. La {{phase.1.letter}} es recursiva."
  # Self-deflating aside near the opening of the book (English: "It does not, of course.").
  aside: "{{acronym.word}} significa **Bicho raro, Interpreta, Camino indirecto, Hallazgos y Octetos**. Claro que no."
  # What the letters give the reader to trace (study-guides opening).
  trace: "Las demás letras te dan algo que seguir: qué se ejecuta, dónde aparece el resultado y qué se trata como datos."
  # Curriculum sentence: the five letters are the five phases.
  phases_note: "Las cinco letras también dan al curso sus cinco fases."

phases:
  - n: 1
    letter: B
    name: Bicho raro
    weeks: "1 a 2"
    question: "¿Qué puede causarlo?"
    definition: "Un programa raro resuelve el reto con un mecanismo que nadie diseñó para eso."
    mermaid_node_id: W
  - n: 2
    letter: I
    name: Interpreta
    weeks: "3 a 6"
    question: "¿Qué lo hace avanzar?"
    definition: "La ejecución: qué instrucción corre ahora y qué la empuja hacia la siguiente."
    mermaid_node_id: E
  - n: 3
    letter: C
    name: Camino indirecto
    weeks: "7 a 10"
    question: "¿Quién exige el trabajo?"
    definition: "El trabajo no se pide de frente: otra pieza lo reclama, lo retrasa o lo reparte."
    mermaid_node_id: I
  - n: 4
    letter: H
    name: Hallazgos
    weeks: "11 a 13"
    question: "¿Qué sobrevive al fallo?"
    definition: "Los resultados: qué queda cuando algo falla y dónde aparece la evidencia."
    mermaid_node_id: R
  - n: 5
    letter: O
    name: Octetos
    weeks: "14 a 15"
    question: "¿Cuándo el código es solo datos?"
    definition: "El código tratado como datos: octetos que otro programa lee, copia o ejecuta."
    mermaid_node_id: D

diagrams:
  # lessons/book/diagrams.py SECTION: the exact heading the diagram check requires.
  section: "Flujo del programa"
  # The one-word form of the heading; a heading that is only this, or the section title in other case, is reported as a near miss.
  section_short: "Flujo"
  # Fixed lead-ins (tools/invariants.py I11 enforces keys named lead_in*): the bold lead-ins of the two paragraphs after the diagram (the text between ** and **).
  lead_in_shows: "Qué muestra:"
  lead_in_why: "Por qué importa este mecanismo:"
  # figcaption word ("Figure 3. ...") and the caption used when a diagram has no accTitle.
  figure: "Figura"
  default_title: "Diagrama"

# lessons/book/study_guides.py: the words the guide checks require. This block is the ONE authoritative source of the
# standard "shared challenge" paragraph (the guides must start that section with exactly this text).
# Wording follows translation/glossary.es.yaml (frozen timecard rule: "pasa de 40", "un total de exactamente 40 continúa").
study_guides:
  # H1 of every guide; {topic} is the guide's subject.
  title: "Guía de estudio de {topic}"
  # The eleven required H2 sections, in order.
  sections:
    - "Para qué sirve esta guía"
    - "Antes de empezar"
    - "El reto compartido"
    - "La máquina que hay que identificar"
    - "Traza una ejecución"
    - "Compara los diseños ordinarios y los raros"
    - "Qué demuestran los ejercicios"
    - "Modos de fallo, costos y límites"
    - "Conexiones a lo largo del repositorio"
    - "Autoevaluación"
    - "Lecturas adicionales"
  # Heading in lessons/intro.md that the shared paragraph links to ({anchor} below is its slug).
  # The translation of intro.md MUST use this exact heading for its "What the challenge does" section.
  challenge_heading: "Qué hace el reto"
  # The standard first paragraph of "The shared challenge". Markdown; {anchor} is filled from challenge_heading.
  shared_challenge: "La [especificación del reto](../../intro.md#{anchor}) pide tarjetas con una categoría y de 10 a 19 horas enteras. Las categorías se repiten en ciclo: `Meetings`, `Coding`, `Debugging` y `Learning`. Suma las horas de cada tarjeta al total acumulado. Detente cuando el total pasa de 40. Conserva la **primera tarjeta con la que el total pasa de 40**. Un total de exactamente 40 continúa. Cuatro tarjetas de 10 horas necesitan una quinta tarjeta, de la categoría `Meetings`. Las ejecuciones conformes tienen de 3 a 5 tarjetas y un total de 41 a 59 horas."
  # Text the shared section must contain (the exact-40 rule).
  exact_forty: "exactamente 40"
  # Fixed bold lead-ins (invariant I11): the five questions under "The machine to identify", the four under "Self-check".
  lead_in_five:
    - "Qué se repite."
    - "Dónde vive el estado."
    - "Qué hace avanzar el paso siguiente."
    - "Qué lo detiene."
    - "Qué confirma."
  lead_in_four:
    - "Traza."
    - "Explica."
    - "Transfiere."
    - "Evidencia."
  # The three assurance labels as written in the guides (matched in lower case).
  assurance:
    guaranteed: "garantizado"
    implementation_permitted: "permitido por la implementación"
    accidentally_exploited: "aprovechado por accidente"
  # The safety model must name the sandbox; the guide must ask for a prediction (a regular expression, case-insensitive).
  sandbox_word: "entorno aislado"
  predict_pattern: "\\bpred(?:ic|ec|ig)"
  # Words that mark unfinished text, besides TODO, TBD and the like which are language-neutral (a regular expression).
  placeholder_pattern: "marcador de posición|por (?:escribir|completar|agregar|añadir)"
