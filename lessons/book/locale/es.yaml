# lessons/book/locale/es.yaml: Spanish locale catalog (data only; no logic).
# P1-004 writes the acronym and phase catalog. Later tasks (P2-001 onward) add the rest.
#
# The acronym is a PARAMETER. Prose and PO files use the macros {{acronym.word}},
# {{phase.N.letter}} and {{phase.N.name}}, expanded from this file at apply time.
# To switch to the runner-up TORCE, edit only this block and re-apply (see decisions-provisional.md).
# Mermaid node IDs W E I R D never change; only displayed labels do.
# Phase names are written with a capital first letter whose initial is the phase letter.

acronym:
  word: BICHO
  # Exactly the text counted by the editorial test (one occurrence per publication).
  expansion: "Bicho raro, Interpreta, Camino indirecto, Hallazgos y Octetos"
  # First letter of the word is also the first letter of phase 1: the acronym is recursive.
  recursive_letter: "{{phase.1.letter}}"
  recursive_note: "La {{phase.1.letter}} es recursiva."
  # One-sentence gloss used where the English reads "X stands for Y. The W is recursive."
  gloss: "**{{acronym.word}}** significa **Bicho raro, Interpreta, Camino indirecto, Hallazgos y Octetos**. La {{phase.1.letter}} es recursiva."
  # Self-deflating aside near the opening of the book (English: "It does not, of course.").
  aside: "{{acronym.word}} significa **Bicho raro, Interpreta, Camino indirecto, Hallazgos y Octetos**. Claro que no."
  # What the letters give the reader to trace (study-guides opening).
  trace: "Las demás letras te dan algo que seguir: qué se ejecuta, dónde aparece el resultado y qué se trata como datos."
  # Curriculum sentence: the five letters are the five phases.
  phases_note: "Las cinco letras también dan al curso sus cinco fases."

phases:
  - n: 1
    letter: B
    name: Bicho raro
    weeks: "1 a 2"
    question: "¿Qué puede causarlo?"
    definition: "Un programa raro resuelve el reto con un mecanismo que nadie diseñó para eso."
    mermaid_node_id: W
  - n: 2
    letter: I
    name: Interpreta
    weeks: "3 a 6"
    question: "¿Qué lo hace avanzar?"
    definition: "La ejecución: qué instrucción corre ahora y qué la empuja hacia la siguiente."
    mermaid_node_id: E
  - n: 3
    letter: C
    name: Camino indirecto
    weeks: "7 a 10"
    question: "¿Quién exige el trabajo?"
    definition: "El trabajo no se pide de frente: otra pieza lo reclama, lo retrasa o lo reparte."
    mermaid_node_id: I
  - n: 4
    letter: H
    name: Hallazgos
    weeks: "11 a 13"
    question: "¿Qué sobrevive al fallo?"
    definition: "Los resultados: qué queda cuando algo falla y dónde aparece la evidencia."
    mermaid_node_id: R
  - n: 5
    letter: O
    name: Octetos
    weeks: "14 a 15"
    question: "¿Cuándo el código es solo datos?"
    definition: "El código tratado como datos: octetos que otro programa lee, copia o ejecuta."
    mermaid_node_id: D

diagrams:
  # lessons/book/diagrams.py SECTION: the exact heading the diagram check requires.
  section: "Flujo del programa"
  # The one-word form of the heading; a heading that is only this, or the section title in other case, is reported as a near miss.
  section_short: "Flujo"
  # Fixed lead-ins (tools/invariants.py I11 enforces keys named lead_in*): the bold lead-ins of the two paragraphs after the diagram (the text between ** and **).
  lead_in_shows: "Qué muestra:"
  lead_in_why: "Por qué importa este mecanismo:"
  # figcaption word ("Figure 3. ...") and the caption used when a diagram has no accTitle.
  figure: "Figura"
  default_title: "Diagrama"

# lessons/book/study_guides.py: the words the guide checks require. This block is the ONE authoritative source of the
# standard "shared challenge" paragraph (the guides must start that section with exactly this text).
# Wording follows translation/glossary.es.yaml (frozen timecard rule: "pasa de 40", "un total de exactamente 40 continúa").
study_guides:
  # H1 of every guide; {topic} is the guide's subject.
  title: "Guía de estudio de {topic}"
  # The eleven required H2 sections, in order.
  sections:
    - "Para qué sirve esta guía"
    - "Antes de empezar"
    - "El reto compartido"
    - "La máquina que hay que identificar"
    - "Traza una ejecución"
    - "Compara los diseños ordinarios y los raros"
    - "Qué demuestran los ejercicios"
    - "Modos de fallo, costos y límites"
    - "Conexiones a lo largo del repositorio"
    - "Autoevaluación"
    - "Lecturas adicionales"
  # Heading in lessons/introduccion.md that the shared paragraph links to ({anchor} below is its slug).
  # The translation of introduccion.md MUST use this exact heading for its "What the challenge does" section.
  challenge_heading: "Qué hace el reto"
  # The standard first paragraph of "The shared challenge". Markdown; {anchor} is filled from challenge_heading.
  shared_challenge: "La [especificación del reto](../../introduccion.md#{anchor}) pide tarjetas con una categoría y de 10 a 19 horas enteras. Las categorías se repiten en ciclo: `Meetings`, `Coding`, `Debugging` y `Learning`. Suma las horas de cada tarjeta al total acumulado. Detente cuando el total pasa de 40. Conserva la **primera tarjeta con la que el total pasa de 40**. Un total de exactamente 40 continúa. Cuatro tarjetas de 10 horas necesitan una quinta tarjeta, de la categoría `Meetings`. Las ejecuciones conformes tienen de 3 a 5 tarjetas y un total de 41 a 59 horas."
  # Text the shared section must contain (the exact-40 rule).
  exact_forty: "exactamente 40"
  # Fixed bold lead-ins (invariant I11): the five questions under "The machine to identify", the four under "Self-check".
  lead_in_five:
    - "Qué se repite."
    - "Dónde vive el estado."
    - "Qué hace avanzar el paso siguiente."
    - "Qué lo detiene."
    - "Qué confirma."
  lead_in_four:
    - "Traza."
    - "Explica."
    - "Transfiere."
    - "Evidencia."
  # The three assurance labels as written in the guides (matched in lower case).
  assurance:
    guaranteed: "garantizado"
    implementation_permitted: "permitido por la implementación"
    accidentally_exploited: "aprovechado por accidente"
  # The safety model must name the sandbox; the guide must ask for a prediction (a regular expression, case-insensitive).
  sandbox_word: "entorno aislado"
  predict_pattern: "\\bpred(?:ic|ec|ig)"
  # Words that mark unfinished text, besides TODO, TBD and the like which are language-neutral (a regular expression).
  placeholder_pattern: "marcador de posición|por (?:escribir|completar|agregar|añadir)"

# lessons/book/cs.py: the words of the generated chapters, tables, indexes and blocks. {name} marks a value the code fills in.
# Frontmatter values (kind, evaluation, tags, ids) are data, not words, and are never looked up here.
cs:
  banner: "GENERADO por lessons/book/build.py a partir de lessons/cs-source/ y del frontmatter de las entradas. No lo edites; edita las fuentes y ejecuta build.py."
  # Phrases that must not come back in hand-written prose (lower case): the generator now says which concepts have entries.
  stale_phrases:
    - "ninguna entrada usa esto todavía"
    - "sirve de trasfondo para las demás"
  # The three assurance labels in generated tables, keyed by the frontmatter value (glossary: assurance_labels).
  assurance:
    guaranteed: "garantizado"
    implementation_permitted: "permitido por la implementación"
    accidentally_exploited: "aprovechado por accidente"
  # How an entry relates to a concept (the kind shown in the "In this repo" table and in the indexes).
  relation:
    demonstrates: "demuestra"
    analogy: "analogía"
    counterexample: "contraejemplo"
  # Table column headers.
  header:
    language_tool: "Lenguaje o herramienta"
    real_machine: "La máquina que es en realidad"
    state_lives_long: "Dónde vive el estado del programa"
    lesson: "Lección"
    place: "Lugar"
    entry: "Entrada"
    name: "Nombre"
    evaluation: "Evaluación"
    languages: "Lenguajes"
    kind: "Tipo"
    plays_loop: "Qué hace de bucle"
    assurance: "Garantía"
    pairs_with: "Se empareja con"
    language: "Lenguaje"
    teaches: "Qué enseña"
    how_relates: "Cómo se relaciona"
    machine: "La máquina"
    state_lives: "Dónde vive el estado"
    concept: "Concepto"
    chapter: "Capítulo"
    used_by: "Entradas que lo usan"
  # Fixed bold lead-ins (invariant I11): the text between ** and **.
  lead_in_in_repo: "En este repositorio:"
  lead_in_applies_all: "Se aplica a todas las entradas"
  lead_in_applies_machine: "Se aplica a toda entrada que nombra su máquina"
  lead_in_practice: "Practícalo:"
  lead_in_entries: "Entradas:"
  # Cross-cutting statements. {n} entries of {total}; {link} the table of machines (a Markdown link target); {because} the concept's reason.
  applies_all: "({n}). {because}"
  applies_machine: "({n} de {total}; mira la [tabla de máquinas]({link})). {because}"
  practice_only: " Ninguna entrada demuestra esta idea, así que el ejercicio es el ejemplo."
  users_all: "todas las entradas"
  users_machine: "toda entrada que nombra su máquina"
  users_exercise: "un ejercicio"
  role_empty: "Ninguna entrada usa esto todavía."
  concepts_of: "Las ideas de ciencias de la computación detrás de esta página: {list}."
  # The "How each program runs" block of a lesson page. {link} points at the introduction's challenge section.
  program_flow_heading: "Cómo corre cada programa"
  program_flow_intro: "Cada imagen de abajo es la sección `## Flujo del programa` del README de una entrada, copiada aquí por la compilación. Muestra cómo ese programa hace el trabajo: lo que el lenguaje, el entorno de ejecución o la herramienta hacen en realidad. [La introducción]({link}) muestra qué pide el reto y en qué se distinguen las entradas."
  program_flow_of: "Flujo del programa de `{dir}`"
  program_flow_from: "Desde {entry} ([sección original]({link}))."
  # The generated chapter opener and the book index.
  opener_title: "Por concepto de ciencias de la computación"
  opener_chapters: "Los capítulos"
  opener_index: "Índice de conceptos"
  index_title: "Índice"
  index_intro: "Tres índices, todos construidos con los metadatos al comienzo del README de cada entrada: los conceptos de ciencias de la computación, los lenguajes y las entradas mismas. En el PDF, un número de página sigue a cada enlace que apunta dentro del libro."
  index_concepts: "Índice de conceptos"
  index_languages: "Índice de lenguajes"
  index_entries: "Índice de entradas"
  index_roles: "Índice de papeles: qué hace de bucle"
  index_language_line: "- **{name}**: lección {pages}; entradas {entries}"
  study_guides_heading: "Guías de estudio"
  study_guides_intro: "Guías escritas a mano para lectores avanzados: trazas de una ejecución fija, predicciones antes de ejecutar y evidencia. Son un documento aparte del libro. Mira [las guías de estudio](guias-de-estudio/README.md)."
  study_guides_languages: "Familias de lenguajes"
  study_guides_concepts: "Conceptos"

# lessons/plan-de-estudios/build.py: the words its checks depend on (the acronym and phase letters come from the acronym and phases blocks).
curriculum:
  # Longest descriptive sentence, in words. Same value as sentence_word_limit_N in loop/CONFIG.yaml (house-style.es.md rule 2);
  # recalibrate both together after the pilot. A whole number written as text (the catalog mirror check requires structural integers to be equal in both files).
  max_words: "29"
  # The printed chapter label in table links: "[Cap. 4](../lessons/informatica/...)".
  chapter_label: "Cap."
  # House style rule 3: the register is tú, so the formal "usted" and the voseo and vosotros forms are refused.
  register_pattern: "\\b(?:usted|vos|vosotros|vosotras|vuestr[oa]s?)\\b"
  # A maintainer diagnostic, not book text: it names the problem in a check report.
  register_label: "register slip (usted, vos or vosotros; the register is tú)"

# lessons/book/test_editorial.py: the words of the cross-volume editorial checks. Regular expressions are case-sensitive unless noted.
# The translation tasks must write the guide, README and APL sentences so that these patterns match them.
editorial:
  # The acronym aside must occur once before these headings (README raíz, primera guía de estudio); la intro usa study_guides.challenge_heading.
  root_opening_end: "Por qué existe"
  guides_opening_end: "Cómo funciona cada guía"
  # The count line of the root README: two groups, the number of challenges and the number of languages.
  root_count_pattern: "\\*\\*(\\d+) retos en (\\d+) lenguajes\\*\\*"
  # The assurance tally of the portability guide: group 1 the count, group 2 one of the study_guides.assurance labels ({labels} is filled in).
  tally_pattern: "\\*\\*(\\d+)\\*\\* (?:entradas )?tienen la garantía \"?({labels})\"?"
  # The four APL explanations (lower case) that must match src/apl/timecards.apl: four assignments, five rolls, up to five, and the wrong "seven slots".
  apl_four: "cuatro asignaciones de arreglos con nombre"
  apl_five_pattern: "cinco (tiradas|sorteos)"
  apl_up_to_five: "hasta cinco"
  apl_seven_slots: "siete casillas"

# lessons/book/pdf_sentinels.py: the selectable words of the diagram labels that the PDF check looks for (code sentinels are not here: they never change).
# A space after a comparison sign (≤ or ≥) may be lost at an SVG tspan boundary, so the check tolerates it there only.
# Alive is an APL identifier (it stays); the question mark of a Spanish label is paired (¿...?) and the check looks at the closing one.
sentinels:
  apl_diagram: "Alive: ¿total ≤ 40?"
  ascii_diagram: "-1 mientras total <= 40; si no, 0"
  forth_diagram: "El intérprete lee: 0 0 >in @"
  awk_diagram: "Última regla: ¿t ≥ 41?"
  apl_book: "⍴ (cambio de forma), ⍳ (generador de índices)"
  apl_guide: "APL básico: ⍳, ⍴"

# lessons/book/repo_links.py, build.py, lint_pdf.py and the study-guides and curriculum builds: who the edition is and where it lives.
# The metadata YAMLs (lessons/*/metadata.yaml) carry the same title, language tag and identifiers; test_repo_links.py keeps them in step.
identity:
  language_tag: "es-419"
  repo_url: "https://github.com/dullroar/aprende-a-programar-como-un-bicho-raro"
  branch: "main"
  book_title: "¡Aprende a programar como un bicho raro!"   # the title in metadata.yaml is this, a space and "v<book-version>"
  book_stem: "aprende-a-programar-como-un-bicho-raro"       # the PDF and EPUB are <stem>.pdf and <stem>.epub
  study_guides_stem: "aprende-a-programar-como-un-bicho-raro-guias-de-estudio"
  curriculum_stem: "plan-de-estudios"
  toc_title: "Contenido"                                    # the PDF's table of contents heading

