# lessons/book/locale/en.yaml: English mirror of the locale catalog (data only; no logic).
#
# Every key here must exist in es.yaml and vice versa (lessons/book/locale/catalog.py --check).
# The values are the English literals the publication tooling carries today, so the English
# tooling can run against this catalog and produce the same output as before.
# Add a key to BOTH files in the same commit.

acronym:
  word: WEIRD
  expansion: "Weird Execution, Indirect Results and Data"
  recursive_letter: "{{phase.1.letter}}"
  recursive_note: "The {{phase.1.letter}} is recursive."
  gloss: "**{{acronym.word}}** stands for **Weird Execution, Indirect Results and Data**. The {{phase.1.letter}} is recursive."
  aside: "{{acronym.word}} stands for **Weird Execution, Indirect Results and Data**. It does not, of course."
  trace: "The rest gives you something to trace: what executes, where the result turns up and what the program gets away with treating as data."
  phases_note: "The five letters also give the course its five phases."

phases:
  - n: 1
    letter: W
    name: Weird
    weeks: "1 to 2"
    question: "What can it cause?"
    definition: "A weird program solves the challenge with a mechanism nobody designed for it."
    mermaid_node_id: W
  - n: 2
    letter: E
    name: Execution
    weeks: "3 to 6"
    question: "What moves it forward?"
    definition: "The run itself: which instruction executes now and what pushes it to the next one."
    mermaid_node_id: E
  - n: 3
    letter: I
    name: Indirect
    weeks: "7 to 10"
    question: "Who demands the work?"
    definition: "The work is not asked for head on: another piece demands it, delays it or hands it out."
    mermaid_node_id: I
  - n: 4
    letter: R
    name: Results
    weeks: "11 to 13"
    question: "What survives failure?"
    definition: "The outcomes: what is left when something fails and where the evidence turns up."
    mermaid_node_id: R
  - n: 5
    letter: D
    name: Data
    weeks: "14 to 15"
    question: "When is code just data?"
    definition: "Code treated as data: bytes that another program reads, copies or runs."
    mermaid_node_id: D

diagrams:
  # lessons/book/diagrams.py SECTION: the exact heading the diagram check requires.
  section: "Program Flow"
  # The one-word form of the heading; a heading that is only this, or the section title in other case, is reported as a near miss.
  section_short: "Flow"
  # Fixed lead-ins (tools/invariants.py I11 enforces keys named lead_in*): the bold lead-ins of the two paragraphs after the diagram (the text between ** and **).
  lead_in_shows: "What this shows:"
  lead_in_why: "Why this mechanism matters:"
  # figcaption word ("Figure 3. ...") and the caption used when a diagram has no accTitle.
  figure: "Figure"
  default_title: "Diagram"

# lessons/book/study_guides.py: the words the guide checks require. This block is the ONE authoritative source of the
# standard "shared challenge" paragraph (the guides must start that section with exactly this text).
study_guides:
  # H1 of every guide; {topic} is the guide's subject.
  title: "{topic} study guide"
  # The eleven required H2 sections, in order.
  sections:
    - "What this guide is for"
    - "Before you begin"
    - "The shared challenge"
    - "The machine to identify"
    - "Trace one run"
    - "Compare the ordinary and weird designs"
    - "What the exercises demonstrate"
    - "Failure modes, costs and boundaries"
    - "Connections across the repository"
    - "Self-check"
    - "Further reading"
  # Heading in lessons/intro.md that the shared paragraph links to ({anchor} below is its slug).
  challenge_heading: "What the challenge does"
  # The standard first paragraph of "The shared challenge". Markdown; {anchor} is filled from challenge_heading.
  shared_challenge: "The [challenge specification](../../intro.md#{anchor}) calls for cards with a category and 10 to 19 whole hours. Categories cycle through Meetings, Coding, Debugging and Learning. Add each card's hours to the running total. Stop when the total passes 40. Keep the **first card that takes the total over 40**. A total of exactly 40 continues. Four 10-hour cards need a fifth card, in the Meetings category. Conforming runs finish with 3 to 5 cards and a total of 41 to 59 hours."
  # Text the shared section must contain (the exact-40 rule).
  exact_forty: "exactly 40"
  # Fixed bold lead-ins (invariant I11): the five questions under "The machine to identify", the four under "Self-check".
  lead_in_five:
    - "What repeats."
    - "Where state lives."
    - "What advances the next step."
    - "What stops it."
    - "What commits."
  lead_in_four:
    - "Trace."
    - "Explain."
    - "Transfer."
    - "Evidence."
  # The three assurance labels as written in the guides (matched in lower case).
  assurance:
    guaranteed: "guaranteed"
    implementation_permitted: "implementation-permitted"
    accidentally_exploited: "accidentally exploited"
  # The safety model must name the sandbox; the guide must ask for a prediction (a regular expression, case-insensitive).
  sandbox_word: "sandbox"
  predict_pattern: "\\bpredict"
  # Words that mark unfinished text, besides TODO, TBD and the like which are language-neutral (a regular expression).
  placeholder_pattern: "placeholder|to be (?:written|done|added)"
