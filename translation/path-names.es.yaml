# translation/path-names.es.yaml: Spanish names for student-facing paths (plan 5.6, P3B-001).
# Input of tools/pathmap.py. The English path stays the canonical key; this table only says what each
# renamable English path is called in Spanish. The tool decides what MAY be renamed (keep-list and
# reference-closure scan): a row here for a path a frozen file mentions is ignored and reported,
# and a row for a keep-list path (README.md, LICENSE, ...) is an error.
#
# Naming rules: ASCII lowercase kebab-case, no accents, no n-tilde; take each word from the glossary
# (translation/glossary.es.yaml) so file names and prose agree; language and command names stay
# (forth, awk, make, cmake); "and" becomes "y"; keep extensions and numeric prefixes; an all-caps
# document name stays all-caps (RETO.md).
schema: 1

# English directory path -> Spanish name of that last path component.
dirs:
  lessons/cs: informatica
  lessons/languages: lenguajes
  lessons/study-guides: guias-de-estudio
  lessons/study-guides/concepts: conceptos
  lessons/study-guides/languages: lenguajes
  lessons/curriculum: plan-de-estudios

