# translation/localization-scope.yaml (Part II, plan 4.5.3 rule 1)
#
# One row per entry family of the 230 protected files (family names are the
# `family` field of translation/part2/code-inventory.jsonl, written in this
# repo's layout). Status values:
#   frozen     - byte-identical to the pinned English source (default for all)
#   localizing - may change, only through tools/loc_apply.py, with a map entry
#                and oracle proof (tools/oracle.py), per translation/part2/policy.md
# Decision 11: the four card categories are localized per family, through loc_apply and the oracle, like any mapped string.
# Every family is `frozen` at S1. A family changes to `localizing` only in its own
# Phase S5 task, in the same commit that localizes it. `never: true` marks
# families that policy.md forbids localizing at all (status must stay frozen).
# S2-003 teaches tools/lock_code.py to read this file; until then no S task may
# change a protected file.

version: 1
default_status: frozen
